name: cross-platform build

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:            
            - os: ubuntu-latest
              arch: x64-sse4-popcnt
              flag: ENABLE_SIMD_SSE4_2

            - os: ubuntu-latest
              arch: x64-avx2
              flag: ENABLE_SIMD_AVX2
              
            - os: windows-latest
              arch: x64-sse4-popcnt
              flag: ENABLE_SIMD_SSE4_2

            - os: windows-latest
              arch: x64-avx2
              flag: ENABLE_SIMD_AVX2

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install CMake on Linux
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y build-essential cmake

    - name: Configure CMake
      working-directory: ${{ github.workspace }}
      run: >
        cmake -B ${{ github.workspace }}/build 
        -DCMAKE_BUILD_TYPE=Release 
        -D${{ matrix.flag }}=ON

    - name: Build Project
      run: cmake --build ${{ github.workspace }}/build --config Release --parallel

    - name: Smoke Test on Linux
      if: runner.os == 'Linux'
      working-directory: ${{github.workspace}}/build
      run: ./Leaf bench

    - name: Smoke Test on Windows
      if: runner.os == 'Windows'
      working-directory: ${{github.workspace}}/build/Release
      run: .\Leaf.exe bench
